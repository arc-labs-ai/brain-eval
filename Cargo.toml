[package]
name = "brain-eval"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/arc-labs-ai/brain-eval"
description = "Evaluation, benchmarking, and report generation for Brain — the cognitive substrate for AI agents."

[features]
default = []
# Enables LLM-as-judge + LLM answer synthesis. Off by default — real LLM
# calls cost money and require a live API key. Build/run with `--features
# live-llm` and the single shared `BRAIN__LLM__API_KEY` (provider derived
# from the model id) to opt in; the runner falls back to the heuristic
# judge when the feature is off or no key is set.
live-llm = []

# ----------------------------------------------------------------------------
# Dependency on the SDK — and ONLY the SDK.
#
# brain-eval is a black-box client: it drives a running brain-server purely
# over the wire through the published Rust SDK, never the substrate's
# internal crates. Wire types it needs (MemoryResult, MemoryKindWire, the
# id aliases) are re-exported from `brain_db_sdk::wire`. This keeps the
# eval rig decoupled from substrate internals — the whole point of the
# repo split.
#
# We depend on the PUBLISHED crate (`brain-db-sdk = "0.1"`); the
# `[patch.crates-io]` at the bottom redirects to the sibling `brain-sdk`
# checkout for local co-development, so this repo builds standalone (from
# crates.io, once published) and in the side-by-side layout (from the
# path) without edits. Same pattern brain-shell uses.
#
# STATUS (checked against the crates.io API — a GET on
# /api/v1/crates/brain-db-sdk currently 404s): brain-db-sdk is NOT yet
# published. The only way this repo builds today is via the
# `[patch.crates-io]` sibling checkout below — CI's `check` job always
# checks out `../brain-sdk` for exactly this reason, so the "pure
# crates.io" path is untested and will fail for anyone who clones this
# repo alone without the sibling checkout. Once brain-sdk publishes 0.1.0,
# drop this note; until then, treat the `[patch]` block as load-bearing,
# not optional.
# ----------------------------------------------------------------------------

[dependencies]
brain-db-sdk = "0.1"

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.7", features = ["v7", "serde"] }
thiserror = "1"
tracing = "0.1"
# The binary installs this at startup so tracing:: calls actually reach
# stderr instead of being silently dropped by the default no-op
# dispatcher. RUST_LOG-controlled (defaults to "info" — see
# src/bin/brain-eval.rs::init_tracing).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pins the judge prompt into the report: BenchmarkMeta records the
# sha256 of the rendered judge template so a silent prompt edit can't
# masquerade as the same eval. Unconditional (the meta block is not
# behind live-llm) and tiny.
sha2 = "0.10"

# Bounded concurrency for the runner. Conversations and their questions are
# independent (each conversation owns a `SpaceId`), and the work is
# network-bound — server round-trips and LLM judge calls — so overlapping
# them is the difference between a run costing the SUM of its latencies and
# costing their maximum. `buffer_unordered` gives that with a hard cap on
# in-flight work, which doubles as the server-load and LLM rate limit.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# HTTP client. Core dependency: the runner uses it for the admin
# `/metrics` extraction-drain barrier (independent of LLM), and the
# `live-llm` judge / synthesizer reuse it. rustls (no system OpenSSL);
# `json` for request/response bodies.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

# Local co-development override: build against the sibling SDK checkout
# instead of the crates.io release. Remove (or comment out) to force a
# pure crates.io build, e.g. when validating the published package.
[patch.crates-io]
brain-db-sdk = { path = "../brain-sdk/rust" }
