[package]
name = "brain-eval"
version = "2.0.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/arc-labs-ai/brain-eval"
description = "Evaluation, benchmarking, and report generation for Brain — the cognitive substrate for AI agents."

# NOT PUBLISHED. This is an internal evaluation harness, not a library anyone
# consumes: it drives a running brain-server, loads benchmark datasets and
# writes reports. Publishing it would put the whole bench rig — dataset
# loaders, blackbox/scale suites, scorers, reporters — on a public registry for
# no one's benefit, and crates.io names cannot be reused once taken.
#
# `publish = false` makes `cargo publish` refuse outright, so this does not
# depend on a workflow being absent or a secret being unset. It previously did:
# the release workflow published on any `v*` tag, and the only thing stopping
# it was that RELEASE_PLEASE_TOKEN was missing, so release-please's tag never
# fired it. That is an accident holding a door shut, not a decision.
publish = false

[features]
default = []
# Enables LLM-as-judge + LLM answer synthesis. Off by default — real LLM
# calls cost money and require a live API key. Build/run with `--features
# live-llm` and the single shared `BRAIN__LLM__API_KEY` (provider derived
# from the model id) to opt in; the runner falls back to the heuristic
# judge when the feature is off or no key is set.
live-llm = []

# ----------------------------------------------------------------------------
# Dependency on the SDK — and ONLY the SDK.
#
# brain-eval is a black-box client: it drives a running brain-server purely
# over the wire through the published Rust SDK, never the substrate's
# internal crates. Wire types it needs (MemoryResult, MemoryKindWire, the
# id aliases) are re-exported from `brain_db_sdk::wire`. This keeps the
# eval rig decoupled from substrate internals — the whole point of the
# repo split.
#
# We depend on the PUBLISHED crate from crates.io, with no
# `[patch.crates-io]` override: brain-db-sdk 0.2.0 is published, so this
# repo builds standalone from a bare clone with no sibling checkout
# required. brain-eval's only SDK-family dependency is brain-db-sdk itself
# (no brain-edge), so there is no second consumer whose resolution would
# need unifying — nothing here needs a patch, and a patch would only risk
# silently diverging from what CI and consumers actually build.
#
# To test an unreleased SDK change locally, add a `[patch.crates-io]`
# entry pointing at `../brain-sdk/rust` *and* make sure the version
# requirement below is satisfiable by that checkout's version — a patch
# whose version cannot satisfy the requirement is silently ignored by
# Cargo (it only warns "patch ... was not used in the crate graph") and
# the registry copy is used instead. Revert both before committing.
# ----------------------------------------------------------------------------

[dependencies]
brain-db-sdk = "0.2"

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.7", features = ["v7", "serde"] }
thiserror = "1"
tracing = "0.1"
# The binary installs this at startup so tracing:: calls actually reach
# stderr instead of being silently dropped by the default no-op
# dispatcher. RUST_LOG-controlled (defaults to "info" — see
# src/bin/brain-eval.rs::init_tracing).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pins the judge prompt into the report: BenchmarkMeta records the
# sha256 of the rendered judge template so a silent prompt edit can't
# masquerade as the same eval. Unconditional (the meta block is not
# behind live-llm) and tiny.
sha2 = "0.10"

# Bounded concurrency for the runner. Conversations and their questions are
# independent (each conversation owns a `SpaceId`), and the work is
# network-bound — server round-trips and LLM judge calls — so overlapping
# them is the difference between a run costing the SUM of its latencies and
# costing their maximum. `buffer_unordered` gives that with a hard cap on
# in-flight work, which doubles as the server-load and LLM rate limit.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# HTTP client. Core dependency: the runner uses it for the admin
# `/metrics` extraction-drain barrier (independent of LLM), and the
# `live-llm` judge / synthesizer reuse it. rustls (no system OpenSSL);
# `json` for request/response bodies.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
