name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly full live run + on-demand.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

# A newer push to a branch supersedes the in-flight run for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: both jobs only ever check out code (the `live`
# job's cross-repo checkouts use their own explicit token). Neither needs
# to write anything back to GitHub.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build + lint + the no-server tests (unit, parser/golden, library logic).
  # The ignored e2e / scale / system / soak tests need a running
  # brain-server and run in the `live` job.
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # brain-eval depends only on the published `brain-db-sdk` from
      # crates.io — no `[patch.crates-io]`, so no sibling SDK checkout is
      # needed and this job exercises exactly what a bare clone builds.
      - name: Checkout brain-eval
        uses: actions/checkout@v7
        with:
          path: brain-eval

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Format
        working-directory: brain-eval
        run: cargo fmt --all -- --check

      - name: Build
        working-directory: brain-eval
        run: cargo build --all-targets

      - name: Clippy
        working-directory: brain-eval
        run: cargo clippy --all-targets -- -D warnings

      # docs.rs is where a reader meets this crate and no job invoked rustdoc,
      # so nothing noticed when its links rotted — eight warnings had
      # accumulated. The levels are `#![deny(rustdoc::all)]` in `src/lib.rs`,
      # beside the crate's other lint attributes; this step is the invocation,
      # without which those levels cannot fire.
      - name: Docs (rustdoc links resolve)
        working-directory: brain-eval
        run: cargo doc --no-deps --all-features

      - name: Test (no-server)
        working-directory: brain-eval
        run: |
          cargo nextest run
          cargo test --doc

      # Nothing audited dependencies. This crate mints data-plane keys and
      # talks to a real server, and the sibling SDK, MCP and edge repos all
      # gate this; here it was the one missing check.
      #
      # `cargo audit` exits non-zero on a *vulnerability* and only warns on
      # `unsound`/`unmaintained`, which is what is wanted: the tree carries two
      # unsoundness warnings (anyhow's `Error::downcast_mut` and tokio's
      # `AsyncFd::new`) that no released version fixes yet, and failing on them
      # would mean pinning the gate open from day one.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        working-directory: brain-eval
        run: cargo audit

  # Live tier: build the brain-server image, provision the models, and run
  # the full-stack acceptance / scenario / soak / regression gates against
  # it. Runs on pushes to main, nightly, and on demand — NOT on every PR
  # (it builds a release image + boots containers, which is too heavy for
  # PR latency). The 1M scale-run + 48h soak are the reference-hardware
  # extension (AcceptanceConfig::full_scale / a long soak config); this job
  # is the smoke-scale live gate that must stay green continuously.
  live:
    if: >-
      ${{ github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout brain-eval
        uses: actions/checkout@v7
        with:
          path: brain-eval
      # The server image is built from the brain repo's Dockerfile. If brain
      # is private, set a repo-scoped PAT in the `BRAIN_REPO_TOKEN` secret;
      # for a public repo the default checkout suffices.
      - name: Checkout brain (server, for the image build + model bootstrap)
        uses: actions/checkout@v7
        with:
          repository: arc-labs-ai/brain-db
          path: brain
          token: ${{ secrets.BRAIN_REPO_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: brain-eval

      # The three models brain-server refuses to start without
      # (embed + reranker + gliner, ~1.8 GiB). Cached across runs; the
      # bootstrap script skips any model already on disk.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/brain/models
          key: brain-models-${{ hashFiles('brain/.devcontainer/bootstrap-model.sh') }}
      - name: Provision models
        run: |
          chmod +x brain/.devcontainer/bootstrap-model.sh
          brain/.devcontainer/bootstrap-model.sh
      - name: Load models into the brain-models volume
        run: |
          docker volume create brain-models
          docker run --rm \
            -v brain-models:/models \
            -v "$HOME/.local/share/brain/models:/src:ro" \
            alpine sh -c 'cp -a /src/. /models/ && ls -1 /models'

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build brain:latest
        uses: docker/build-push-action@v7
        with:
          context: brain
          load: true
          tags: brain:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every `#[ignore]` live test boots its own full-stack container
      # (distinct ports / names / volumes) and cleans up after itself.
      # cargo runs the test binaries sequentially, so at most one container
      # is live at a time. `--ignored` selects exactly the live tests.
      # Brain refuses to boot without an LLM provider key: write-time HyPE
      # generation is mandatory and always-on, so there is no key-less mode to
      # fall back to. Without this the container exits on a config error, and
      # every live gate below fails for a reason that has nothing to do with
      # what it tests. Fail the job here, with the cause, rather than 21 times
      # over with a boot timeout.
      - name: Require the LLM credential
        run: |
          if [ -z "${BRAIN__LLM__API_KEY}" ]; then
            echo "::error::BRAIN_LLM_API_KEY secret is not set. The CI broker \
          serves it to every namespace Brain resolves, and write-time HyPE is \
          mandatory, so every live acceptance gate would fail once a write \
          needed a credential. Set the secret in repo settings, or skip the \
          live job."
            exit 1
          fi
          # The provider is derived from the MODEL id, not from the key, and
          # the built-in default is `gpt-4o-mini`. An Anthropic key with that
          # default boots cleanly and then fails on every upstream call, which
          # reads as a Brain fault rather than a config one. Require the pair
          # to agree here instead.
          case "${BRAIN__LLM__MODEL}" in
            claude-*|anthropic/*) provider=anthropic ;;
            "")                   provider=default-openai ;;
            *)                    provider=openai ;;
          esac
          case "${BRAIN__LLM__API_KEY}" in
            sk-ant-*) key=anthropic ;;
            *)        key=other ;;
          esac
          if [ "$key" = "anthropic" ] && [ "$provider" != "anthropic" ]; then
            echo "::error::BRAIN_LLM_API_KEY looks like an Anthropic key but \
          BRAIN__LLM__MODEL is '${BRAIN__LLM__MODEL:-<unset, defaults to gpt-4o-mini>}', \
          which routes to OpenAI. Set the BRAIN_LLM_MODEL repo variable to a \
          claude-* model id."
            exit 1
          fi
        env:
          BRAIN__LLM__API_KEY: ${{ secrets.BRAIN_LLM_API_KEY }}
          BRAIN__LLM__MODEL: ${{ vars.BRAIN_LLM_MODEL }}

      # Brain resolves an LLM credential per namespace and refuses to boot
      # without `[llm.broker]` — a process-wide `[llm] api_key` is not a
      # substitute. In production that broker is the Arc gateway; CI has one
      # shared key and no control plane, so this stands in for it.
      #
      # This is what the live tier was missing. Every one of its 21 gates died
      # in under half a second on `config error: invalid config:
      # `[llm.broker]` is missing`, which read as 21 test failures and was one
      # configuration gap.
      #
      # Bound on 0.0.0.0 and reached from inside each brain container through
      # the `host.docker.internal:host-gateway` mapping the harness now adds.
      - name: Start the CI LLM broker
        working-directory: brain-eval
        env:
          BROKER_SERVICE_KEY: brain-eval-ci-broker
          BROKER_MODEL: ${{ vars.BRAIN_LLM_MODEL }}
          BROKER_LLM_API_KEY: ${{ secrets.BRAIN_LLM_API_KEY }}
          BROKER_LISTEN: 0.0.0.0:9099
        run: |
          nohup python3 scripts/ci-llm-broker.py > "${RUNNER_TEMP}/broker.log" 2>&1 &
          for _ in $(seq 1 25); do
            if curl -fsS -m 2 -H "authorization: Bearer brain-eval-ci-broker" \
                 http://127.0.0.1:9099/llm/ns/preflight/resolve >/dev/null 2>&1; then
              echo "broker is serving"; cat "${RUNNER_TEMP}/broker.log"; exit 0
            fi
            sleep 1
          done
          echo "::error::the CI LLM broker did not start"
          cat "${RUNNER_TEMP}/broker.log" || true
          exit 1

      - name: Live acceptance gates
        working-directory: brain-eval
        env:
          BRAIN_EVAL_IMAGE_TAG: latest
          # Brain resolves per namespace through the broker above. The URL is
          # ordinary config; the service key is Brain's identity to the broker
          # and rides a 0600 env-file, never a `docker run` argv.
          BRAIN__LLM__BROKER__URL: http://host.docker.internal:9099
          BRAIN__LLM__BROKER__SERVICE_KEY: brain-eval-ci-broker
          # `BRAIN__LLM__API_KEY` is deliberately absent. It is the shard-wide
          # fallback, not the serving credential — Brain's own config says
          # setting it "does not make a keyless namespace work" — and its boot
          # preflight makes a 1-token completion *only when it is present*,
          # refusing to start if the provider rejects it. The broker holds the
          # real credential (see the step above) and proxies completions, so
          # the server needs none of its own. The harness also drops it
          # whenever a broker is configured; this keeps the workflow honest
          # about why rather than relying on that.
          # Brain derives the provider from the model id, so this is what
          # selects Anthropic vs OpenAI; the key alone does not. The harness
          # forwards it into the container alongside the key.
          BRAIN__LLM__MODEL: ${{ vars.BRAIN_LLM_MODEL }}
        # The `live` profile pins test-threads=1 (each test boots its own
        # container). --run-ignored ignored-only selects exactly the live tests.
        run: cargo nextest run --release --profile live --run-ignored ignored-only --no-capture

      - name: Stop the CI LLM broker
        if: always()
        run: |
          pkill -f ci-llm-broker.py || true
          # On a failure the broker's log says whether Brain ever resolved,
          # which separates "the broker was wrong" from "the test was".
          cat "${RUNNER_TEMP}/broker.log" || true

      - name: Clean up docker
        if: always()
        run: |
          docker ps -aq --filter "name=brain-eval-" | xargs -r docker rm -f
          docker volume ls -q | grep -E "brain-eval-|brain-acc-" | xargs -r docker volume rm -f || true
