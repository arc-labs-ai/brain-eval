name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly full live run + on-demand.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

# A newer push to a branch supersedes the in-flight run for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: both jobs only ever check out code (the `live`
# job's cross-repo checkouts use their own explicit token). Neither needs
# to write anything back to GitHub.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build + lint + the no-server tests (unit, parser/golden, library logic).
  # The ignored e2e / scale / system / soak tests need a running
  # brain-server and run in the `live` job.
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # brain-eval depends only on the published `brain-db-sdk` from
      # crates.io — no `[patch.crates-io]`, so no sibling SDK checkout is
      # needed and this job exercises exactly what a bare clone builds.
      - name: Checkout brain-eval
        uses: actions/checkout@v7
        with:
          path: brain-eval

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Format
        working-directory: brain-eval
        run: cargo fmt --all -- --check

      - name: Build
        working-directory: brain-eval
        run: cargo build --all-targets

      - name: Clippy
        working-directory: brain-eval
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (no-server)
        working-directory: brain-eval
        run: |
          cargo nextest run
          cargo test --doc

  # Live tier: build the brain-server image, provision the models, and run
  # the full-stack acceptance / scenario / soak / regression gates against
  # it. Runs on pushes to main, nightly, and on demand — NOT on every PR
  # (it builds a release image + boots containers, which is too heavy for
  # PR latency). The 1M scale-run + 48h soak are the reference-hardware
  # extension (AcceptanceConfig::full_scale / a long soak config); this job
  # is the smoke-scale live gate that must stay green continuously.
  live:
    if: >-
      ${{ github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout brain-eval
        uses: actions/checkout@v7
        with:
          path: brain-eval
      # The server image is built from the brain repo's Dockerfile. If brain
      # is private, set a repo-scoped PAT in the `BRAIN_REPO_TOKEN` secret;
      # for a public repo the default checkout suffices.
      - name: Checkout brain (server, for the image build + model bootstrap)
        uses: actions/checkout@v7
        with:
          repository: arc-labs-ai/brain-db
          path: brain
          token: ${{ secrets.BRAIN_REPO_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: brain-eval

      # The three models brain-server refuses to start without
      # (embed + reranker + gliner, ~1.8 GiB). Cached across runs; the
      # bootstrap script skips any model already on disk.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/brain/models
          key: brain-models-${{ hashFiles('brain/.devcontainer/bootstrap-model.sh') }}
      - name: Provision models
        run: |
          chmod +x brain/.devcontainer/bootstrap-model.sh
          brain/.devcontainer/bootstrap-model.sh
      - name: Load models into the brain-models volume
        run: |
          docker volume create brain-models
          docker run --rm \
            -v brain-models:/models \
            -v "$HOME/.local/share/brain/models:/src:ro" \
            alpine sh -c 'cp -a /src/. /models/ && ls -1 /models'

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build brain:latest
        uses: docker/build-push-action@v7
        with:
          context: brain
          load: true
          tags: brain:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every `#[ignore]` live test boots its own full-stack container
      # (distinct ports / names / volumes) and cleans up after itself.
      # cargo runs the test binaries sequentially, so at most one container
      # is live at a time. `--ignored` selects exactly the live tests.
      # Brain refuses to boot without an LLM provider key: write-time HyPE
      # generation is mandatory and always-on, so there is no key-less mode to
      # fall back to. Without this the container exits on a config error, and
      # every live gate below fails for a reason that has nothing to do with
      # what it tests. Fail the job here, with the cause, rather than 21 times
      # over with a boot timeout.
      - name: Require the LLM credential
        run: |
          if [ -z "${BRAIN__LLM__API_KEY}" ]; then
            echo "::error::BRAIN_LLM_API_KEY secret is not set. Brain cannot boot \
          without an LLM provider key (write-time HyPE is mandatory), so every \
          live acceptance gate would fail on a config error. Set the secret in \
          repo settings, or skip the live job."
            exit 1
          fi
          # The provider is derived from the MODEL id, not from the key, and
          # the built-in default is `gpt-4o-mini`. An Anthropic key with that
          # default boots cleanly and then fails on every upstream call, which
          # reads as a Brain fault rather than a config one. Require the pair
          # to agree here instead.
          case "${BRAIN__LLM__MODEL}" in
            claude-*|anthropic/*) provider=anthropic ;;
            "")                   provider=default-openai ;;
            *)                    provider=openai ;;
          esac
          case "${BRAIN__LLM__API_KEY}" in
            sk-ant-*) key=anthropic ;;
            *)        key=other ;;
          esac
          if [ "$key" = "anthropic" ] && [ "$provider" != "anthropic" ]; then
            echo "::error::BRAIN_LLM_API_KEY looks like an Anthropic key but \
          BRAIN__LLM__MODEL is '${BRAIN__LLM__MODEL:-<unset, defaults to gpt-4o-mini>}', \
          which routes to OpenAI. Set the BRAIN_LLM_MODEL repo variable to a \
          claude-* model id."
            exit 1
          fi
        env:
          BRAIN__LLM__API_KEY: ${{ secrets.BRAIN_LLM_API_KEY }}
          BRAIN__LLM__MODEL: ${{ vars.BRAIN_LLM_MODEL }}

      - name: Live acceptance gates
        working-directory: brain-eval
        env:
          BRAIN_EVAL_IMAGE_TAG: latest
          # Forwarded by the harness into the container via a 0600 env-file;
          # it never lands in a `docker run` argv.
          BRAIN__LLM__API_KEY: ${{ secrets.BRAIN_LLM_API_KEY }}
          # Brain derives the provider from the model id, so this is what
          # selects Anthropic vs OpenAI; the key alone does not. The harness
          # forwards it into the container alongside the key.
          BRAIN__LLM__MODEL: ${{ vars.BRAIN_LLM_MODEL }}
        # The `live` profile pins test-threads=1 (each test boots its own
        # container). --run-ignored ignored-only selects exactly the live tests.
        run: cargo nextest run --release --profile live --run-ignored ignored-only --no-capture

      - name: Clean up docker
        if: always()
        run: |
          docker ps -aq --filter "name=brain-eval-" | xargs -r docker rm -f
          docker volume ls -q | grep -E "brain-eval-|brain-acc-" | xargs -r docker volume rm -f || true
